name: CI

# The point of this file, for module 4:
#
# An agent's behaviour lives in its prompt, and prompts change casually — a
# sentence gets "tidied up" and routing quietly breaks in a way no type checker
# will ever catch. CI is where you find that out before your users do.
#
# Two tiers, deliberately:
#
#   checks  runs on every push with NO API key. Tools, schema shape, service
#           behaviour, eval harness. Fast, free, deterministic.
#
#   eval    runs the real agent against the golden dataset. Needs either a
#           GOOGLE_API_KEY or an OPENAI_API_KEY secret, so it's skipped on forks
#           and for anyone who hasn't set one up.
#
#           If both are set, google wins — it's the free tier, and CI shouldn't
#           spend money by default. Override with a repository *variable*
#           COLLEGE_AGENT_PROVIDER=openai when you want the paid comparison.
#
# Be clear-eyed about what the first tier proves: that the plumbing is sound,
# not that the agent reasons well. Only the second tier tells you that. A green
# badge from `checks` alone is not evidence your agent works.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests & lint (no API key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv .venv --python 3.12

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check src labs evals tests scripts

      - name: Format check
        run: .venv/bin/ruff format --check src labs evals tests scripts

      - name: Tests
        # No GOOGLE_API_KEY in this job on purpose. If a test needs one, it
        # belongs in the eval job, not here.
        run: .venv/bin/python -m pytest -m "not live" -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t college-triage:ci .

      - name: Start it
        run: docker run -d --name triage -p 8000:8000 college-triage:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "healthy after ${i}s"
              curl -s http://localhost:8000/health
              exit 0
            fi
            sleep 1
          done
          echo "never became healthy:"
          docker logs triage
          exit 1

      - name: Service reports degraded without a key
        # The container has no GOOGLE_API_KEY, so it must start, serve, and say
        # so — rather than crash-looping. That behaviour is the thing being
        # tested here.
        run: |
          status=$(curl -s http://localhost:8000/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          test "$status" = "degraded" || { echo "expected degraded, got $status"; exit 1; }

      - name: Stop
        if: always()
        run: docker rm -f triage || true

  eval:
    name: Agent evals (needs an API key)
    runs-on: ubuntu-latest
    needs: checks
    # Skips cleanly when no secret is configured, rather than failing and
    # training everyone to ignore a red build.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv .venv --python 3.12

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Pick a provider
        id: key
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # A repository *variable*, not a secret. Settings > Secrets and
          # variables > Actions > Variables. Only needed to force the paid
          # provider when both keys are present.
          FORCED: ${{ vars.COLLEGE_AGENT_PROVIDER }}
        run: |
          # The model each provider uses here is the cheapest one with the
          # highest rate limits. CI shouldn't eat the quota a person is
          # relying on, and on OpenAI it shouldn't eat their money either.
          if [ "$FORCED" = "openai" ] && [ -n "$OPENAI_API_KEY" ]; then
            provider=openai; model=gpt-5.4-mini
          elif [ "$FORCED" = "google" ] && [ -n "$GOOGLE_API_KEY" ]; then
            provider=google; model=gemini-3.5-flash-lite
          elif [ -n "$GOOGLE_API_KEY" ]; then
            provider=google; model=gemini-3.5-flash-lite
          elif [ -n "$OPENAI_API_KEY" ]; then
            provider=openai; model=gpt-5.4-mini
          else
            provider=""; model=""
          fi

          if [ -n "$provider" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "provider=$provider" >> "$GITHUB_OUTPUT"
            echo "model=$model" >> "$GITHUB_OUTPUT"
            echo "::notice::Running evals on $provider ($model)."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No GOOGLE_API_KEY or OPENAI_API_KEY secret set — skipping the agent evals."
            echo "::notice::Add one under Settings > Secrets > Actions to gate on real agent behaviour."
          fi

      - name: Smoke evals
        if: steps.key.outputs.present == 'true'
        env:
          # Both are passed; the unset one arrives as an empty string, which
          # check_api_key() treats as absent. COLLEGE_AGENT_PROVIDER decides
          # which one is actually read.
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGNO_TELEMETRY: "false"
          # Nothing in evals/ needed changing for this. The judge builds its
          # model through get_model() like everything else, so it follows the
          # provider automatically — that's what centralising bought us.
          COLLEGE_AGENT_PROVIDER: ${{ steps.key.outputs.provider }}
          COLLEGE_AGENT_MODEL: ${{ steps.key.outputs.model }}
        run: |
          mkdir -p evals/results
          .venv/bin/python evals/suite.py --tag smoke --json-output evals/results/ci.json

      - name: Upload results
        if: steps.key.outputs.present == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
